<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECODED 1785: RẠCH GẦM - XOÀI MÚT</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#050505',
                        gold: '#C5A059',
                        blood: '#8A0303',
                        metal: '#9ca3af',
                    },
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    backgroundImage: {
                        'vignette': 'radial-gradient(circle, transparent 20%, #050505 130%)',
                    }
                }
            }
        }
    </script>

    <!-- React & Framer Motion (UMD for file:// protocol compatibility) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #050505;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .scroll-hide::-webkit-scrollbar {
            display: none;
        }

        .scroll-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            width: 100%;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* WebKit/Blink */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #C5A059;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 10px #C5A059;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #333;
            border-radius: 2px;
        }

        /* Firefox */
        input[type=range]::-moz-range-thumb {
            height: 24px;
            width: 24px;
            border: none;
            border-radius: 50%;
            background: #C5A059;
            cursor: pointer;
            box-shadow: 0 0 10px #C5A059;
        }

        input[type=range]::-moz-range-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #333;
            border-radius: 2px;
        }

        .radar-grid {
            background-image:
                linear-gradient(rgba(197, 160, 89, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(197, 160, 89, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { createRoot } = ReactDOM;
        const { motion, AnimatePresence, useScroll, useTransform } = window.Motion;

        // 3. ASSET MANAGEMENT
        const ASSETS = {
            video: {
                hero: './hero.mp4',
                fallback: 'https://images.unsplash.com/photo-1551068222-7771e84323db?q=80&w=2938&auto=format&fit=crop', // Cinematic water/battle fallback
                bg: './nh.mp4' // Using nh.mp4 as potential background or extra content
            },
            audio: {
                command: './speech_2.mp3',
            },
            images: {
                map: './luoc_do.jpg',
                mapFallback: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Tran_Rach_Gam-Xoai_Mut.svg/2560px-Tran_Rach_Gam-Xoai_Mut.svg.png' // Historical map fallback
            }
        };

        // --- COMPONENTS ---

        const DebugHelper = () => {
            useEffect(() => {
                console.log("React App Mounted Successfully");
            }, []);
            return null;
        };

        const IntroOverlay = ({ onComplete }) => {
            // Fail-safe: Force complete after 4.5 seconds if animation hangs
            useEffect(() => {
                const timer = setTimeout(() => {
                    console.log("Force finishing intro...");
                    onComplete();
                }, 4500);
                return () => clearTimeout(timer);
            }, [onComplete]);

            return (
                <motion.div
                    className="fixed inset-0 z-[100] bg-void flex items-center justify-center pointer-events-none"
                    initial={{ opacity: 1 }}
                    animate={{ opacity: 0 }}
                    transition={{ duration: 1.5, delay: 2.5, ease: "circIn" }}
                    onAnimationComplete={onComplete}
                >
                    <DebugHelper />
                    <motion.div
                        initial={{ scale: 0.9, opacity: 0 }}
                        animate={{ scale: 1, opacity: 1 }}
                        transition={{ duration: 1 }}
                        className="text-gold font-serif text-3xl tracking-[0.5em] border border-gold/30 p-8"
                    >
                        1785
                    </motion.div>
                </motion.div>
            );
        };

        const HeroSection = () => {
            // Text stagger animation
            const title = "QUANG TRUNG";
            const letters = Array.from(title);

            const container = {
                hidden: { opacity: 0 },
                visible: {
                    opacity: 1,
                    transition: { staggerChildren: 0.15, delayChildren: 0.5 }
                }
            };

            const child = {
                hidden: { opacity: 0, y: 50, filter: 'blur(10px)' },
                visible: { opacity: 1, y: 0, filter: 'blur(0px)', transition: { duration: 1.2, ease: "easeOut" } }
            };

            return (
                <section className="relative w-full h-screen overflow-hidden flex flex-col items-center justify-center">
                    {/* Background Video */}
                    <div className="absolute inset-0 z-0">
                        <video
                            className="w-full h-full object-cover opacity-60"
                            autoPlay
                            muted
                            loop
                            playsInline
                            poster={ASSETS.video.fallback}
                        >
                            <source src={ASSETS.video.hero} type="video/mp4" />
                        </video>
                        <div className="absolute inset-0 bg-gradient-to-t from-void via-void/50 to-transparent"></div>
                        <div className="absolute inset-0 bg-vignette mix-blend-multiply"></div>
                    </div>

                    {/* Content */}
                    <motion.div
                        className="z-10 text-center px-4"
                        variants={container}
                        initial="hidden"
                        animate="visible"
                    >
                        <motion.h2 variants={child} className="text-metal font-sans tracking-[0.3em] text-sm md:text-lg mb-4 uppercase">
                            Hồ Sơ Chiến Dịch
                        </motion.h2>
                        <h1 className="flex justify-center flex-wrap gap-2 md:gap-4 overflow-hidden">
                            {letters.map((letter, index) => (
                                <motion.span key={index} variants={child} className="text-5xl md:text-9xl font-serif font-bold text-transparent bg-clip-text bg-gradient-to-b from-yellow-200 to-gold drop-shadow-lg">
                                    {letter === " " ? "\u00A0" : letter}
                                </motion.span>
                            ))}
                        </h1>
                        <motion.div variants={child} className="mt-8 flex flex-col items-center gap-2">
                            <div className="h-[1px] w-24 bg-gold/50"></div>
                            <p className="text-gray-400 font-sans text-sm tracking-widest">DECODED 1785</p>
                        </motion.div>
                    </motion.div>

                    <motion.div
                        className="absolute bottom-10 left-1/2 -translate-x-1/2 z-10 flex flex-col items-center"
                        initial={{ opacity: 0 }}
                        animate={{ opacity: 1 }}
                        transition={{ delay: 3, duration: 1 }}
                    >
                        <span className="text-xs text-gold/60 mb-2 font-sans tracking-widest animate-pulse">SCROLL TO DECRYPT</span>
                        <div className="w-[1px] h-12 bg-gradient-to-b from-gold/0 via-gold to-gold/0"></div>
                    </motion.div>
                </section>
            );
        };

        const PhysicsOfWar = () => {
            const [tideLevel, setTideLevel] = useState(100); // 0 to 100

            // Derived states
            const isLowTide = tideLevel < 30;
            const velocity = 100 - tideLevel;

            // Visual Styles based on physics
            const waterHeight = `${20 + (tideLevel * 0.4)}%`;

            // Particle Component for Venturi Effect
            const FlowParticles = () => {
                const particles = Array.from({ length: 15 });
                const speedDuration = Math.max(0.2, 3 - (velocity * 0.03));

                return (
                    <div className="absolute inset-0 overflow-hidden pointer-events-none z-10">
                        {particles.map((_, i) => (
                            <motion.div
                                key={i}
                                className="absolute bg-white/20 rounded-full"
                                style={{
                                    top: `${Math.random() * 80 + 20}%`,
                                    left: -20,
                                    width: Math.random() * 10 + 2,
                                    height: 1,
                                }}
                                animate={{
                                    x: ['0vw', '100vw'],
                                    opacity: [0, 0.5, 0]
                                }}
                                transition={{
                                    duration: speedDuration + Math.random(),
                                    repeat: Infinity,
                                    ease: "linear",
                                    delay: Math.random() * 2
                                }}
                            />
                        ))}
                    </div>
                );
            };

            return (
                <section className="relative w-full min-h-screen bg-void py-20 px-6 flex flex-col items-center">
                    <div className="max-w-4xl w-full">
                        <div className="flex items-center gap-4 mb-12">
                            <div className="h-[1px] flex-1 bg-gold/30"></div>
                            <h2 className="text-3xl md:text-4xl font-serif text-gold text-center uppercase tracking-widest">
                                Vật Lý Chiến Trường
                            </h2>
                            <div className="h-[1px] flex-1 bg-gold/30"></div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                            {/* Controls & Info */}
                            <div className="col-span-1 space-y-8">
                                <div className="bg-void border border-stone-800 p-6 rounded-sm relative overflow-hidden group">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-gold/50"></div>
                                    <h3 className="text-xl font-sans text-white mb-2 font-bold">Thủy Triều & Địa Mạo</h3>
                                    <p className="text-gray-400 text-sm leading-relaxed text-justify mb-4">
                                        Rạch Gầm - Xoài Mút là đoạn sông hẹp. Khi nước rút, <span className="text-gold">Hiệu ứng Cổ chai (Venturi Effect)</span> làm tăng vận tốc dòng chảy, khiến tàu thuyền địch bị mắc cạn và xoay ngang, trở thành bia tập bắn.
                                    </p>

                                    <div className="mt-8">
                                        <div className="flex justify-between text-xs text-gold mb-2 font-sans tracking-widest">
                                            <span>MỰC NƯỚC: {tideLevel}%</span>
                                            <span>VẬN TỐC: {(velocity * 0.5).toFixed(1)} m/s</span>
                                        </div>
                                        <input
                                            type="range"
                                            min="0"
                                            max="100"
                                            value={tideLevel}
                                            onChange={(e) => setTideLevel(Number(e.target.value))}
                                            className="w-full h-2 bg-gray-800 rounded-lg appearance-none cursor-pointer"
                                        />
                                        <div className="flex justify-between text-[10px] text-gray-600 mt-1 uppercase">
                                            <span>Khô Cạn (Nước Rút)</span>
                                            <span>Đầy (Thủy Triều Lên)</span>
                                        </div>
                                    </div>

                                    <AnimatePresence>
                                        {isLowTide && (
                                            <motion.div
                                                initial={{ opacity: 0, height: 0 }}
                                                animate={{ opacity: 1, height: 'auto' }}
                                                exit={{ opacity: 0, height: 0 }}
                                                className="mt-6 bg-blood/20 border border-blood/50 p-3 rounded"
                                            >
                                                <p className="text-blood font-bold text-xs uppercase tracking-wider flex items-center gap-2">
                                                    <span className="w-2 h-2 rounded-full bg-blood animate-ping"></span>
                                                    CẢNH BÁO: TÀU ĐỊCH MẮC CẠN
                                                </p>
                                            </motion.div>
                                        )}
                                    </AnimatePresence>
                                </div>
                            </div>

                            {/* Simulation Visualizer */}
                            <div className="col-span-2 h-[400px] border border-stone-800 relative bg-[#0a0a0a] overflow-hidden rounded-sm select-none">
                                {/* Grid Background */}
                                <div className="absolute inset-0 opacity-20 radar-grid"></div>

                                <FlowParticles />

                                {/* River Bed */}
                                <div className="absolute bottom-0 left-0 right-0 h-1/3 bg-stone-900 clip-path-polygon z-20">
                                    <svg className="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                                        <path d="M0,100 L0,50 Q25,60 50,40 Q75,20 100,60 L100,100 Z" fill="#1c1917" />
                                    </svg>
                                </div>

                                {/* Water */}
                                <motion.div
                                    className="absolute bottom-0 left-0 right-0 bg-blue-900/40 backdrop-blur-sm border-t border-blue-500/30 z-30"
                                    animate={{ height: waterHeight }}
                                    transition={{ type: "spring", bounce: 0, duration: 0.8 }}
                                >
                                    {/* Surface Particles */}
                                    <div className="absolute top-0 w-full h-2 bg-gradient-to-b from-white/10 to-transparent"></div>
                                </motion.div>

                                {/* Enemy Ship Container */}
                                <motion.div
                                    className="absolute left-1/2 bottom-1/3 w-40 h-20 -ml-20 z-40 ship-container"
                                    animate={isLowTide ? {
                                        y: 55,
                                        rotate: -15,
                                        x: -5
                                    } : {
                                        y: [0, -4, 0],
                                        rotate: [-1, 2, -1],
                                        x: 0
                                    }}
                                    transition={isLowTide ? {
                                        type: "spring", stiffness: 60
                                    } : {
                                        duration: 4.5,
                                        repeat: Infinity,
                                        ease: "easeInOut"
                                    }}
                                >
                                    {/* Detailed Ship SVG */}
                                    <svg viewBox="0 0 200 100" className="w-full h-full drop-shadow-2xl filter drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)]">
                                        {/* Reflection Mask Group */}
                                        <defs>
                                            <linearGradient id="sailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                                <stop offset="0%" style={{stopColor:"#e5e7eb", stopOpacity:0.9}} />
                                                <stop offset="100%" style={{stopColor:"#9ca3af", stopOpacity:0.8}} />
                                            </linearGradient>
                                        </defs>

                                        {/* Hull */}
                                        <path d="M40,65 Q100,100 160,65 L150,65 L100,90 L50,65 Z" fill="#1f2937" stroke="#C5A059" strokeWidth="0.5"/>
                                        <path d="M40,65 L50,55 L150,55 L160,65 Z" fill="#374151"/>

                                        {/* Masts */}
                                        <rect x="98" y="15" width="4" height="40" fill="#4b5563"/>
                                        <rect x="130" y="25" width="3" height="30" fill="#4b5563"/>

                                        {/* Sails */}
                                        <path d="M100,17 Q130,35 100,50 Z" fill="url(#sailGrad)" />
                                        <path d="M132,27 Q150,40 132,50 Z" fill="url(#sailGrad)" />

                                        {/* Flags */}
                                        <path d="M100,15 L115,10 L100,20 Z" fill="#8A0303"/>
                                    </svg>

                                    {isLowTide && (
                                        <motion.div
                                            className="absolute -top-6 left-1/2 -translate-x-1/2 bg-blood/90 text-white text-[10px] font-bold px-2 py-1 rounded whitespace-nowrap border border-red-500"
                                            initial={{ opacity: 0, scale: 0 }}
                                            animate={{ opacity: 1, scale: 1 }}
                                        >
                                            ⚠️ STRANDED / MẮC CẠN
                                        </motion.div>
                                    )}
                                </motion.div>

                                {/* Info Overlay */}
                                <div className="absolute top-2 right-2 text-[10px] text-gold/80 font-mono bg-black/50 px-2 py-1 rounded backdrop-blur-sm border border-gold/10">
                                    FLOW_VELOCITY: {(velocity * 0.1).toFixed(2)} m/s
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const TacticalMap = () => {
            const [mode, setMode] = useState('real'); // real | radar
            const [activeHotspot, setActiveHotspot] = useState(null);

            const hotspots = [
                { id: 1, x: 30, y: 45, label: "Mai Phục 1", desc: "Quân Tây Sơn ẩn nấp trong các nhánh sông nhỏ." },
                { id: 2, x: 65, y: 40, label: "Hỏa Công", desc: "Thả bè lửa xuôi dòng thiêu rụi tàu địch." },
                { id: 3, x: 50, y: 60, label: "Khóa Đuôi", desc: "Chặn đường rút lui ra biển." }
            ];

            return (
                <section className="relative w-full py-20 px-6 bg-[#080808] flex flex-col items-center">
                    <div className="max-w-5xl w-full">
                        <div className="flex justify-between items-end mb-8 border-b border-white/10 pb-4">
                            <h2 className="text-3xl font-serif text-gold uppercase">Bản Đồ Nhu Liệu</h2>
                            <div className="flex gap-2">
                                <button
                                    onClick={() => setMode('real')}
                                    className={`px-4 py-1 text-xs font-sans tracking-widest border transition-colors ${mode === 'real' ? 'bg-gold text-black border-gold' : 'text-gray-500 border-gray-800 hover:border-gold/50'}`}
                                >
                                    THỰC ĐỊA
                                </button>
                                <button
                                    onClick={() => setMode('radar')}
                                    className={`px-4 py-1 text-xs font-sans tracking-widest border transition-colors ${mode === 'radar' ? 'bg-gold text-black border-gold' : 'text-gray-500 border-gray-800 hover:border-gold/50'}`}
                                >
                                    RADAR
                                </button>
                            </div>
                        </div>

                        <div className="relative w-full aspect-[16/9] bg-stone-900 overflow-hidden border border-white/10 group">
                            {/* Map Layers */}
                            <AnimatePresence mode="wait">
                                {mode === 'real' ? (
                                    <motion.img
                                        key="real"
                                        src={ASSETS.images.map}
                                        onError={(e) => e.target.src = ASSETS.images.mapFallback}
                                        className="w-full h-full object-cover grayscale opacity-60 group-hover:grayscale-0 transition-all duration-700"
                                        initial={{ opacity: 0 }}
                                        animate={{ opacity: 0.6 }}
                                        exit={{ opacity: 0 }}
                                    />
                                ) : (
                                    <motion.div
                                        key="radar"
                                        className="w-full h-full bg-black relative radar-grid"
                                        initial={{ opacity: 0 }}
                                        animate={{ opacity: 1 }}
                                        exit={{ opacity: 0 }}
                                    >
                                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,rgba(197,160,89,0.1),transparent_70%)]"></div>
                                        {/* Scanner Line */}
                                        <div className="absolute top-0 left-0 w-full h-1 bg-gold/30 shadow-[0_0_10px_#C5A059] animate-[scan_3s_linear_infinite]"></div>
                                    </motion.div>
                                )}
                            </AnimatePresence>

                            {/* Hotspots */}
                            {hotspots.map(spot => (
                                <div
                                    key={spot.id}
                                    className="absolute w-6 h-6 -ml-3 -mt-3 cursor-pointer z-20"
                                    style={{ left: `${spot.x}%`, top: `${spot.y}%` }}
                                    onMouseEnter={() => setActiveHotspot(spot.id)}
                                    onMouseLeave={() => setActiveHotspot(null)}
                                >
                                    <span className="absolute inline-flex h-full w-full rounded-full bg-gold opacity-75 animate-ping"></span>
                                    <span className="relative inline-flex rounded-full h-6 w-6 bg-gold/20 border border-gold backdrop-blur-sm"></span>

                                    {/* Tooltip */}
                                    <AnimatePresence>
                                        {activeHotspot === spot.id && (
                                            <motion.div
                                                initial={{ opacity: 0, scale: 0.8, y: 10 }}
                                                animate={{ opacity: 1, scale: 1, y: 0 }}
                                                exit={{ opacity: 0, scale: 0.8 }}
                                                className="absolute bottom-8 left-1/2 -translate-x-1/2 w-48 bg-black/90 border border-gold/50 p-4 shadow-2xl backdrop-blur-md"
                                            >
                                                <h4 className="text-gold font-serif text-lg leading-none mb-2">{spot.label}</h4>
                                                <p className="text-gray-400 text-xs font-sans leading-tight">{spot.desc}</p>
                                            </motion.div>
                                        )}
                                    </AnimatePresence>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const ComparisonDashboard = () => {
            return (
                <section className="py-20 bg-void border-t border-white/5">
                    <div className="container mx-auto px-6">
                        <h2 className="text-3xl font-serif text-center text-white mb-16">Tương Quan Lực Lượng</h2>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-10 max-w-4xl mx-auto">
                            {/* Enemy */}
                            <div className="bg-[#0a0a0a] p-8 border-t-2 border-blood">
                                <h3 className="text-blood font-sans font-bold tracking-widest text-sm mb-6 uppercase">Quân Xiêm & Nguyễn Ánh</h3>
                                <div className="flex items-end gap-2 mb-2">
                                    <span className="text-6xl font-serif text-white">50</span>
                                    <span className="text-xl text-gray-500 mb-2">.000</span>
                                </div>
                                <div className="w-full bg-stone-900 h-2 rounded-full overflow-hidden mb-8">
                                    <motion.div
                                        className="h-full bg-blood"
                                        initial={{ width: 0 }}
                                        whileInView={{ width: "100%" }}
                                        viewport={{ once: true }}
                                        transition={{ duration: 1.5, ease: "circOut" }}
                                    ></motion.div>
                                </div>
                                <div className="grid grid-cols-2 gap-4 text-xs text-gray-400">
                                    <div className="border border-white/5 p-2 rounded">
                                        <div className="text-white text-lg">300+</div>
                                        <div>Chiến Thuyền</div>
                                    </div>
                                    <div className="border border-white/5 p-2 rounded">
                                        <div className="text-white text-lg">Đa Dạng</div>
                                        <div>Vũ Khí</div>
                                    </div>
                                </div>
                            </div>

                            {/* Hero */}
                            <div className="bg-[#0a0a0a] p-8 border-t-2 border-gold">
                                <h3 className="text-gold font-sans font-bold tracking-widest text-sm mb-6 uppercase">Nghĩa Quân Tây Sơn</h3>
                                <div className="flex items-end gap-2 mb-2">
                                    <span className="text-6xl font-serif text-white">20</span>
                                    <span className="text-xl text-gray-500 mb-2">.000</span>
                                </div>
                                <div className="w-full bg-stone-900 h-2 rounded-full overflow-hidden mb-8">
                                    <motion.div
                                        className="h-full bg-gold"
                                        initial={{ width: 0 }}
                                        whileInView={{ width: "40%" }}
                                        viewport={{ once: true }}
                                        transition={{ duration: 1.5, ease: "circOut", delay: 0.2 }}
                                    ></motion.div>
                                </div>
                                <div className="grid grid-cols-2 gap-4 text-xs text-gray-400">
                                    <div className="border border-white/5 p-2 rounded">
                                        <div className="text-white text-lg">Tinh Nhuệ</div>
                                        <div>Thủy Binh</div>
                                    </div>
                                    <div className="border border-white/5 p-2 rounded">
                                        <div className="text-white text-lg">Hỏa Công</div>
                                        <div>Chiến Thuật</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const AudioCommand = () => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [isBlocked, setIsBlocked] = useState(false);
            const audioRef = useRef(null);

            useEffect(() => {
                const play = async () => {
                    try {
                        if (audioRef.current) {
                            await audioRef.current.play();
                            setIsPlaying(true);
                        }
                    } catch (e) {
                        setIsBlocked(true);
                    }
                };
                play();
            }, []);

            const toggle = () => {
                if (!audioRef.current) return;
                if (isPlaying) {
                    audioRef.current.pause();
                } else {
                    audioRef.current.play();
                }
                setIsPlaying(!isPlaying);
                setIsBlocked(false);
            };

            return (
                <>
                    <audio ref={audioRef} src={ASSETS.audio.command} loop />

                    <motion.button
                        onClick={toggle}
                        className="fixed bottom-8 right-8 z-50 w-16 h-16 md:w-20 md:h-20 rounded-full border-2 border-gold/50 bg-black/80 backdrop-blur text-gold flex items-center justify-center shadow-[0_0_30px_rgba(197,160,89,0.2)] group"
                        whileHover={{ scale: 1.05 }}
                        whileTap={{ scale: 0.95 }}
                        animate={isBlocked ? {
                            boxShadow: ["0 0 0 0 rgba(197,160,89,0.7)", "0 0 0 20px rgba(197,160,89,0)"],
                        } : {}}
                        transition={isBlocked ? {
                            repeat: Infinity,
                            duration: 1.5
                        } : {}}
                    >
                        {/* Drum Icon */}
                        <div className={`relative w-8 h-8 transition-all ${isPlaying ? 'scale-90' : 'scale-100'}`}>
                            {isPlaying ? (
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            ) : (
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            )}
                        </div>

                        {/* Text Ring Animation */}
                        <svg className="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 100 100">
                            <defs>
                                <path id="circle" d="M 50, 50 m -37, 0 a 37,37 0 1,1 74,0 a 37,37 0 1,1 -74,0" />
                            </defs>
                            <text fontSize="11" fill="#C5A059" letterSpacing="2">
                                <textPath href="#circle" startOffset="0%" className="uppercase opacity-80">
                                    • War Command • Lệnh Tấn Công
                                </textPath>
                            </text>
                        </svg>

                        {isBlocked && (
                            <div className="absolute -top-10 left-1/2 -translate-x-1/2 whitespace-nowrap bg-gold text-black text-[10px] font-bold px-2 py-1 rounded">
                                NHẤN ĐỂ KHỞI ĐỘNG
                            </div>
                        )}
                    </motion.button>
                </>
            );
        };

        const Footer = () => (
            <footer className="py-12 bg-black text-center border-t border-white/5">
                <p className="text-gold/50 font-serif italic mb-2">"Đánh cho để dài tóc, đánh cho để đen răng"</p>
                <p className="text-gray-600 text-xs font-sans tracking-widest uppercase">© 2026 DECODED Series. Developed by Creative Technologist.</p>
            </footer>
        );

        const App = () => {
            const [introDone, setIntroDone] = useState(false);

            return (
                <div className="relative bg-void w-full min-h-screen text-white overflow-hidden scroll-smooth">
                    {/* Film Grain & Global Effects */}
                    <div className="film-grain"></div>

                    {!introDone && <IntroOverlay onComplete={() => setIntroDone(true)} />}

                    <main className={introDone ? "opacity-100 transition-opacity duration-1000" : "opacity-0"}>
                        <HeroSection />

                        <div className="relative z-20 shadow-[0_-50px_100px_#050505]">
                            <TacticalMap />
                            <PhysicsOfWar />
                            <ComparisonDashboard />
                            <Footer />
                        </div>
                    </main>

                    <AudioCommand />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>

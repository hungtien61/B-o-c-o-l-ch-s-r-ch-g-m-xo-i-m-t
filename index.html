<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HÀO KHÍ TÂY SƠN: RẠCH GẦM 1785</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <!-- MediaPipe Hands (Module) -->
    <script type="module">
        import { FilesetResolver, HandLandmarker } from "https://cdn.skypack.dev/@mediapipe/tasks-vision@0.10.0";
        window.FilesetResolver = FilesetResolver;
        window.HandLandmarker = HandLandmarker;
        window.MediaPipeReady = true;
        console.log("MediaPipe Modules Loaded Successfully");
    </script>

    <!-- 1. THAY THẾ TOÀN BỘ PHẦN FONTS VÀ STYLE TRONG THẺ HEAD -->

    <!-- Google Fonts: Cormorant Garamond (Sử thi) & Montserrat (Hiện đại) & Cinzel Decorative (Tiêu đề rực lửa) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;700&family=Cinzel+Decorative:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'royal-gold': '#F4C430', // Vàng kim loại sáng hơn
                        'blood-red': '#8a0303',
                        'ink-black': '#050a0e',
                        'paper': '#f4e4bc',
                    },
                    fontFamily: {
                        'epic': ['"Cormorant Garamond"', 'serif'], // Font văn bản
                        'cinzel': ['"Cinzel Decorative"', 'cursive'], // Font tiêu đề chính
                        'body': ['"Montserrat"', 'sans-serif'],
                    },
                    backgroundImage: {
                        'paper-texture': "url('https://www.transparenttextures.com/patterns/aged-paper.png')",
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'shine': 'shine 3s linear infinite', // Hiệu ứng quét sáng
                    },
                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
                        shine: { '0%': { backgroundPosition: '-200% center' }, '100%': { backgroundPosition: '200% center' } }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: #f4e4bc;
            overflow-x: hidden;
        }

        /* Hiệu ứng chữ vàng kim loại (Metallic Gold) */
        .text-gold-gradient {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
            animation: shine 5s linear infinite;
        }

        /* Removed vignette for cleaner look */

        .text-glow-container {
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.9);
            position: relative;
            z-index: 51;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #b38728;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="root"></div>


    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Sửa đoạn này để tránh lỗi undefined dẫn đến màn hình đen
        const motion = window.Motion.motion;
        const AnimatePresence = window.Motion.AnimatePresence;
        const useMotionValue = window.Motion.useMotionValue;
        const useTransform = window.Motion.useTransform;
        // --- CẤU HÌNH TÀI NGUYÊN (Đã cập nhật đúng tên file bạn cần) ---
        const ASSETS = {
            HERO_VIDEO: "./nh.mp4",   // Video nền (Phải để cùng thư mục với file html)
            AUDIO_SPEECH: "./speech 2.mp3", // File âm thanh câu nói (Phải để cùng thư mục)
            MAP_REAL: "luoc do.jpg",
            DRAGON_PATTERN: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Dong_Son_drum_tympanum.svg/1024px-Dong_Son_drum_tympanum.svg.png"
        };
        // --- COMPONENT MỚI: THANH TIẾN TRÌNH (Tăng tính chuyên nghiệp) ---
        const ScrollProgress = () => {
            const [width, setWidth] = useState(0);
            useEffect(() => {
                const handleScroll = () => {
                    const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
                    const progress = (window.scrollY / totalHeight) * 100;
                    setWidth(progress);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            return (
                <div className="fixed top-0 left-0 h-1 bg-gradient-to-r from-[#d4af37] via-[#fcf6ba] to-[#d4af37] z-[100] transition-all duration-100 ease-out shadow-[0_0_10px_#d4af37]"></div>
            );
        };

        // --- COMPONENT MỚI: TRÌNH PHÁT ÂM THANH (Audio Player) ---
        // --- COMPONENT: TRÌNH PHÁT ÂM THANH (Cơ chế Smart Autoplay) ---
        // --- COMPONENT: TRÌNH PHÁT ÂM THANH (Xử lý lỗi chặn Autoplay) ---
        const AudioPlayer = () => {
            const [playing, setPlaying] = useState(false);
            const audioRef = useRef(null);

            useEffect(() => {
                // Hàm thử phát âm thanh
                const tryPlay = async () => {
                    if (audioRef.current) {
                        try {
                            await audioRef.current.play();
                            setPlaying(true);
                        } catch (err) {
                            console.log("Trình duyệt chặn autoplay. Đang chờ tương tác...");
                        }
                    }
                };

                tryPlay();

                // Lắng nghe cú nhấp chuột đầu tiên của người dùng để mở khóa âm thanh
                const unlockAudio = () => {
                    if (audioRef.current && audioRef.current.paused) {
                        audioRef.current.play();
                        setPlaying(true);
                    }
                    // Sau khi đã phát, gỡ bỏ sự kiện này để tối ưu
                    window.removeEventListener('click', unlockAudio);
                    window.removeEventListener('keydown', unlockAudio);
                };

                window.addEventListener('click', unlockAudio);
                window.addEventListener('keydown', unlockAudio); // Bấm phím cũng mở khóa

                return () => {
                    window.removeEventListener('click', unlockAudio);
                    window.removeEventListener('keydown', unlockAudio);
                };
            }, []);

            const toggle = () => {
                if (playing) {
                    audioRef.current.pause();
                    setPlaying(false);
                } else {
                    audioRef.current.play();
                    setPlaying(true);
                }
            };

            return (
                <div className="fixed bottom-6 right-6 z-[90] flex flex-col items-end gap-2">
                    {/* Thông báo nhắc người dùng nếu nhạc chưa chạy */}
                    {!playing && (
                        <div className="bg-blood-red text-white text-[10px] px-3 py-1 border border-royal-gold rounded animate-bounce font-bold">
                            NHẤP CHUỘT ĐỂ NGHE HỊCH 🔊
                        </div>
                    )}
                    <button
                        onClick={toggle}
                        className={`w-14 h-14 rounded-full border-2 border-royal-gold flex items-center justify-center transition-all shadow-[0_0_20px_#d4af37] ${playing ? 'bg-royal-gold text-black animate-[spin_10s_linear_infinite]' : 'bg-black/90 text-royal-gold hover:scale-110'}`}
                    >
                        <audio ref={audioRef} src={ASSETS.AUDIO_SPEECH} loop />
                        <span className="material-symbols-outlined text-2xl">{playing ? 'volume_up' : 'play_arrow'}</span>
                    </button>
                </div>
            );
        };

        // --- COMPONENT MỚI: HIỆU ỨNG CUỘN (Scroll Reveal) ---
        // Dùng để bọc các nội dung quan trọng, giúp chúng hiện ra mượt mà khi cuộn tới
        const FadeSection = ({ children }) => {
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) setVisible(true);
                }, { threshold: 0.1 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div ref={ref} className={`transition-all duration-1000 transform ${visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-20'}`}>
                    {children}
                </div>
            );
        };
        // --- COMPONENT: HERO SECTION (Trang chủ) ---
        // --- COMPONENT: HERO SECTION (Trang chủ) ---
        // --- COMPONENT: HERO SECTION (Video Nền) ---
        // --- COMPONENT: HERO SECTION (Video Nền) ---
        // --- 3. THAY THẾ TOÀN BỘ COMPONENT HERO CŨ BẰNG ĐOẠN NÀY ---
        const Hero = () => {
            const videoRef = useRef(null);
            const { scrollY } = window.Motion.useScroll();
            const y1 = window.Motion.useTransform(scrollY, [0, 500], [0, 200]);
            const y2 = window.Motion.useTransform(scrollY, [0, 500], [0, -150]);
            const opacity = window.Motion.useTransform(scrollY, [0, 300], [1, 0]);

            useEffect(() => {
                if (videoRef.current) {
                    videoRef.current.defaultMuted = true;
                    videoRef.current.muted = true;
                    videoRef.current.play().catch(e => console.log("Video autoplay blocked:", e));
                }
            }, []);

            return (
                <section className="relative h-screen flex items-center justify-center overflow-hidden bg-ink-black">
                    {/* Video Nền - Parallax Layer Back */}
                    <motion.div style={{ y: y1 }} className="absolute inset-0 z-0">
                        <video
                            ref={videoRef} autoPlay loop muted playsInline
                            className="w-full h-full object-cover filter brightness-[0.5] contrast-110"
                            onTimeUpdate={(e) => {
                                if (e.target.currentTime >= 32) {
                                    e.target.currentTime = 0;
                                }
                            }}
                        >
                            <source src={ASSETS.HERO_VIDEO} type="video/mp4" />
                        </video>
                        <div className="absolute inset-0 bg-gradient-to-t from-ink-black via-transparent to-black/60"></div>
                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_0%,#000000_100%)] opacity-70"></div>
                    </motion.div>

                    {/* Nội dung chính - Parallax Layer Front */}
                    <motion.div
                        style={{ y: y2, opacity }}
                        className="relative z-10 text-center px-4 flex flex-col items-center"
                    >
                        <motion.div
                            initial={{ opacity: 0, y: -20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 1 }}
                            className="border-y border-royal-gold/50 py-2 px-8 mb-6 bg-black/40 backdrop-blur-sm"
                        >
                            <span className="text-royal-gold font-body tracking-[0.5em] text-xs md:text-sm uppercase font-bold">Đại Phá Quân Xiêm // 1785</span>
                        </motion.div>

                        <motion.h1
                            initial={{ scale: 0.9, opacity: 0, y: 0 }}
                            animate={{
                                scale: 1,
                                opacity: 1,
                                y: [0, -10, 0],
                                textShadow: [
                                    "0 0 20px rgba(197, 160, 89, 0.3)",
                                    "0 0 50px rgba(197, 160, 89, 0.6)",
                                    "0 0 20px rgba(197, 160, 89, 0.3)"
                                ],
                                filter: ["brightness(1)", "brightness(1.3)", "brightness(1)"]
                            }}
                            transition={{
                                scale: { duration: 1.2, delay: 0.2 },
                                opacity: { duration: 1.2, delay: 0.2 },
                                y: { duration: 6, repeat: Infinity, ease: "easeInOut", delay: 1.4 },
                                textShadow: { duration: 4, repeat: Infinity, ease: "easeInOut", delay: 1.4 },
                                filter: { duration: 4, repeat: Infinity, ease: "easeInOut", delay: 1.4 }
                            }}
                            className="text-[13vw] md:text-[10vw] font-cinzel font-black text-transparent bg-clip-text bg-gradient-to-b from-[#FFF5C3] via-[#D4AF37] to-[#8B6C42] leading-none drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)] mb-4 tracking-wide z-20 relative whitespace-nowrap"
                        >
                            QUANG TRUNG
                            {/* Lớp phủ hiệu ứng lửa/kim loại */}
                            <span className="absolute inset-0 block text-transparent bg-clip-text bg-gradient-to-t from-transparent via-white/30 to-transparent animate-shine pointer-events-none" style={{ backgroundSize: '200% auto' }}>QUANG TRUNG</span>
                        </motion.h1>

                        <motion.h2
                            initial={{ opacity: 0, y: 0 }}
                            animate={{
                                opacity: 1,
                                y: [0, -10, 0]
                            }}
                            transition={{
                                opacity: { duration: 1, delay: 0.8 },
                                y: { duration: 5, repeat: Infinity, ease: "easeInOut", delay: 1.8 }
                            }}
                            className="text-2xl md:text-5xl font-epic text-white italic tracking-wider opacity-90"
                        >
                            Nguyễn Huệ
                        </motion.h2>

                        <motion.div
                            initial={{ width: 0 }} animate={{ width: "100px" }} transition={{ duration: 1, delay: 1 }}
                            className="h-1 bg-gradient-to-r from-transparent via-royal-gold to-transparent my-8"
                        ></motion.div>

                        <motion.p
                            initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 1, delay: 1.2 }}
                            className="max-w-3xl mx-auto text-gray-300 font-body text-base md:text-xl leading-relaxed font-light"
                        >
                            "Đánh cho để dài tóc, đánh cho để đen răng.<br />
                            Đánh cho nó chích luân bất phản, đánh cho nó phiến giáp bất hoàn."
                        </motion.p>

                        <motion.div
                            initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 2 }}
                            className="mt-16 animate-bounce"
                        >
                            <span className="material-symbols-outlined text-royal-gold/80 text-5xl">keyboard_double_arrow_down</span>
                        </motion.div>
                    </motion.div>
                </section>
            );
        };
        // --- COMPONENT: BẢN ĐỒ CHIẾN LƯỢC (Map) ---
        const StrategyMap = () => {
            return (
                <section className="py-20 px-4 bg-ink-black relative border-t border-royal-gold/30">
                    <div className="max-w-6xl mx-auto flex flex-col md:flex-row gap-12 items-center">

                        {/* Cột Thông tin (Bên trái) - Đã thêm z-[51] để nổi lên trên lớp vignette tối */}
                        <div className="md:w-1/3 space-y-8 text-left relative z-[51]">
                            <h3 className="text-4xl font-epic text-royal-gold border-l-4 border-blood-red pl-4">
                                THẾ TRẬN<br />THIÊN LA ĐỊA VÕNG
                            </h3>
                            <p className="font-poetry text-gray-400 text-lg text-justify">
                                Dòng sông Tiền đoạn qua Rạch Gầm - Xoài Mút rộng lớn nhưng hiểm trở. Nguyễn Huệ đã biến địa hình tự nhiên thành một "túi đựng quân" khổng lồ.
                            </p>

                            <ul className="space-y-4">
                                {[
                                    { title: "Nghi Binh", desc: "Dùng thuyền nhỏ khiêu chiến, giả thua để dụ địch vào sâu." },
                                    { title: "Khóa Đuôi", desc: "Thủy triều xuống, thuyền lớn của Xiêm bị mắc cạn và dồn ứ." },
                                    { title: "Hỏa Công", desc: "Thuyền bè lửa xuôi dòng thiêu rụi hạm đội địch." }
                                ].map((item, idx) => (
                                    <li key={idx} className="flex gap-4 group cursor-pointer hover:bg-white/5 p-2 rounded transition-all">
                                        <div className="w-10 h-10 flex items-center justify-center border border-royal-gold rounded-full text-royal-gold font-bold font-epic group-hover:bg-royal-gold group-hover:text-black transition-all">
                                            {idx + 1}
                                        </div>
                                        <div>
                                            <h4 className="text-white font-bold font-epic group-hover:text-royal-gold transition-colors">{item.title}</h4>
                                            <p className="text-sm text-gray-500">{item.desc}</p>
                                        </div>
                                    </li>
                                ))}
                            </ul>
                        </div>

                        {/* Cột Bản đồ (Bên phải) */}
                        <div className="md:w-2/3 relative group">
                            <div className="absolute -inset-2 bg-gradient-to-r from-royal-gold via-red-500 to-royal-gold rounded opacity-30 blur-xl group-hover:opacity-75 transition duration-1000 animate-pulse"></div>

                            <div className="relative border-4 border-double border-yellow-900 bg-paper p-2 shadow-2xl rounded overflow-hidden">
                                <motion.div
                                    className="absolute inset-0 z-20 pointer-events-none"
                                    initial={{ opacity: 0 }}
                                    whileHover={{ opacity: 1 }}
                                >
                                    {/* Interactive Spots Overlay */}
                                    <div className="absolute top-[30%] left-[40%] w-32 h-32 border-2 border-red-500 rounded-full animate-ping opacity-50"></div>
                                    <div className="absolute top-[50%] right-[30%] w-24 h-24 border-2 border-royal-gold rounded-full animate-ping opacity-50 animation-delay-500"></div>
                                </motion.div>

                                <img
                                    src={ASSETS.MAP_REAL}
                                    alt="Lược đồ Trận Rạch Gầm - Xoài Mút"
                                    className="w-full h-auto object-contain hover:scale-105 transition-transform duration-1000 ease-out"
                                    onError={(e) => {
                                        e.target.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Tran_Rach_Gam_-_Xoai_Mut.svg/1920px-Tran_Rach_Gam_-_Xoai_Mut.svg.png";
                                    }}
                                />
                                <div className="absolute bottom-4 right-4 bg-black/70 px-3 py-1 text-xs font-mono text-royal-gold border border-royal-gold/50 rounded z-20 backdrop-blur">
                                    LƯỢC ĐỒ GỐC 1785 // HOVER TO ANALYZE
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // --- COMPONENT: THỐNG KÊ (Stats) ---
        // --- COMPONENT: THỐNG KÊ (Stats - Đã sửa lỗi hiển thị) ---
        const Stats = () => (
            <section className="py-16 bg-blood-red/10 border-y border-royal-gold/20 relative overflow-hidden">
                <img src={ASSETS.DRAGON_PATTERN} className="absolute top-0 right-0 w-96 opacity-5 rotate-12 -mr-20 -mt-20 pointer-events-none" />
                <div className="max-w-6xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8 text-center relative z-10">

                    {/* Cột 1 */}
                    <div>
                        <div className="text-5xl font-epic font-black text-white mb-2">5 VẠN</div>
                        <div className="text-sm font-poetry text-royal-gold tracking-widest uppercase">Quân Xiêm Xâm Lược</div>
                    </div>

                    {/* Cột 2 (Giữa) - Đã sửa lỗi gạch giữa & màu tối */}
                    <div className="relative">
                        {/* Đường kẻ bên trái (ngăn cách với cột 1) */}
                        <div className="absolute left-0 top-2 bottom-2 w-[1px] bg-royal-gold/30 hidden md:block"></div>

                        {/* Chữ chuyển sang màu đỏ tươi (red-500) + Hiệu ứng phát sáng (drop-shadow) */}
                        <div className="text-5xl font-epic font-black text-red-500 mb-2 drop-shadow-[0_0_15px_rgba(220,38,38,0.8)]">1 NGÀY</div>
                        <div className="text-sm font-poetry text-royal-gold tracking-widest uppercase">Thời Gian Quét Sạch</div>

                        {/* Đường kẻ bên phải (ngăn cách với cột 3) */}
                        <div className="absolute right-0 top-2 bottom-2 w-[1px] bg-royal-gold/30 hidden md:block"></div>
                    </div>

                    {/* Cột 3 */}
                    <div>
                        <div className="text-5xl font-epic font-black text-white mb-2">300+</div>
                        <div className="text-sm font-poetry text-royal-gold tracking-widest uppercase">Chiến Thuyền Bị Phá</div>
                    </div>
                </div>
            </section>
        );
        // --- COMPONENT MỚI: DÒNG CHẢY LỊCH SỬ (Timeline) ---
        // --- COMPONENT MỚI: DÒNG CHẢY LỊCH SỬ (Timeline - Chuẩn Cinematic) ---
        // --- COMPONENT MỚI: DÒNG CHẢY LỊCH SỬ (BẢN FIX LỖI LAYOUT) ---
        // --- COMPONENT MỚI: DÒNG CHẢY LỊCH SỬ (BẢN FIX LỖI DUPLICATE) ---
        const Timeline = () => {
            const events = [
                { time: "Đêm 19/01", title: "Bố Trận Bí Mật", desc: "Quân Tây Sơn lợi dụng màn đêm, bí mật di chuyển pháo binh hạng nặng lên cù lao Thới Sơn và ẩn quân vào các ngách sông rạch chằng chịt." },
                { time: "Rạng Sáng 20/01", title: "Khiêu Chiến Dụ Địch", desc: "Nguyễn Huệ chỉ phái một toán thuyền nhẹ ra đánh nhử. Quân Xiêm cậy đông, kiêu ngạo đuổi theo mà không biết đang đi vào cửa tử." },
                { time: "Sáng 20/01", title: "Khóa Chặt Đường Lui", desc: "Khi toàn bộ hạm đội Xiêm lọt vào Rạch Gầm, pháo hiệu nổ vang. Thuyền chiến Tây Sơn từ các nhánh tắt lao ra bịt kín hai đầu sông." },
                { time: "Giờ Ngọ 20/01", title: "Hỏa Công Hủy Diệt", desc: "Nước triều rút mạnh đúng như tính toán. Thuyền Xiêm to lớn mắc cạn, va vào nhau loạn xạ. Bè lửa xuôi dòng thiêu rụi tất cả." }
            ];

            return (
                <section className="py-24 px-4 bg-[#050a0e] relative overflow-hidden group">
                    {/* Fire Atmosphere */}
                    <div className="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-1000 pointer-events-none">
                        <EmberParticles />
                        <div className="absolute inset-0 bg-red-900/10 mix-blend-overlay"></div>
                    </div>

                    {/* Nền họa tiết mờ */}

        // --- COMPONENT MỚI 1: MÔ PHỎNG THỦY TRIỀU (Interactive) ---
        // --- COMPONENT MỚI: MÔ PHỎNG THỦY - ĐỊA CHIẾN THUẬT ---
        // --- COMPONENT: MÔ PHỎNG THỦY - ĐỊA CHIẾN THUẬT (BẢN CINEMATIC) ---
        // --- COMPONENT: MÔ PHỎNG THỦY - ĐỊA CHIẾN THUẬT (BẢN FIX LỖI XOAY) ---
        // --- HELPER: TẠO ÂM THANH VA CHẠM (Synthetic Audio) ---
        const playCrunchSound = () => {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;

            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            // Tạo tiếng ồn (Noise) giả lập tiếng gỗ gãy
            const bufferSize = ctx.sampleRate * 0.5; // 0.5 giây
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;

            // Lọc âm thanh để nghe ầm ầm hơn (Lowpass)
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1000;

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);

            // Envelope (Giảm dần âm lượng)
            gain.gain.setValueAtTime(1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);

            noise.start();

            // Thêm một tiếng "Bíp" trầm để tạo độ nặng
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, ctx.currentTime + 0.5);
            osc.connect(gain);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        };

        // --- HELPER: TIẾNG LỬA CHÁY (Fire Sound) ---
        const playFireSound = () => {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();

            // Tạo tiếng nổ lép bép
            const bufferSize = ctx.sampleRate * 2; // 2 giây
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                // Brown noise cho tiếng cháy
                const white = Math.random() * 2 - 1;
                data[i] = (0 + (2 * white)) / 2; // Simple approximation

                // Thỉnh thoảng thêm tiếng nổ (Pop)
                if (Math.random() > 0.99) {
                    data[i] += 0.5 * (Math.random() > 0.5 ? 1 : -1);
                }
            }

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 800;

            const gain = ctx.createGain();
            gain.gain.value = 0.5;

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start();

            // Dừng sau 5 giây (hết intro)
            setTimeout(() => {
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
                noise.stop(ctx.currentTime + 1);
            }, 6000);
        };

        // --- COMPONENT: IntroParticles (Canvas optimized for Fire/Embers) ---
        const IntroParticles = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                const particles = [];
                const particleCount = 150;

                class Particle {
                    constructor() {
                        this.reset();
                        this.y = Math.random() * height; // Start anywhere
                    }

                    reset() {
                        this.x = Math.random() * width;
                        this.y = height + Math.random() * 100;
                        this.vx = (Math.random() - 0.5) * 1;
                        this.vy = -(Math.random() * 2 + 1);
                        this.size = Math.random() * 3 + 1;
                        this.alpha = Math.random() * 0.5 + 0.5;
                        this.color = `rgba(255, ${Math.floor(Math.random() * 100 + 50)}, 0, ${this.alpha})`;
                        this.life = Math.random() * 100;
                    }

                    update() {
                        this.x += this.vx;
                        this.y += this.vy;
                        this.life--;
                        this.alpha -= 0.005;

                        // Wobble
                        this.x += Math.sin(this.life * 0.1) * 0.5;

                        if (this.y < -50 || this.life < 0 || this.alpha <= 0) {
                            this.reset();
                        }
                    }

                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = this.color.replace(`0, ${this.alpha})`, `0, ${Math.max(0, this.alpha)})`);
                        ctx.fill();

                        // Glow
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = "orange";
                    }
                }

                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }

                const animate = () => {
                    ctx.clearRect(0, 0, width, height);
                    // Add a slight trail effect
                    // ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                    // ctx.fillRect(0, 0, width, height);

                    particles.forEach(p => {
                        p.update();
                        p.draw();
                    });

                    ctx.shadowBlur = 0; // Reset for performance
                    requestAnimationFrame(animate);
                };

                animate();

                const handleResize = () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                };

                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            return <canvas ref={canvasRef} className="absolute inset-0 z-0" />;
        };

                                    <h1 className="text-5xl md:text-8xl font-epic font-black text-transparent bg-clip-text bg-gradient-to-r from-[#bf953f] via-[#fcf6ba] to-[#b38728] drop-shadow-[0_0_30px_rgba(212,175,55,0.6)] leading-tight">
                                        ĐẠI PHÁ<br />QUÂN XIÊM
                                    </h1>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </div>
                </motion.div>
            );
        };

        // --- COMPONENT: TÀU XIÊM (18th Century Ocean Junk) ---
        const SiamShip = ({ scale = 1, crashed, isTrapped }) => {

        const TaySonBoat = () => (

        const TideSimulation = () => {

            const [isPlaying, setIsPlaying] = useState(false);
            const [ships, setShips] = useState([

            ]);

            // Logic Constants
            const GROUND_LEVEL = 25;
            const TRAP_LEVEL = 30;

            useEffect(() => {
                if (!isPlaying) return;

                const interval = setInterval(() => {
                    setShips(prevShips => prevShips.map(ship => {
                        if (ship.crashed) return ship;

                        // Physics
                        let newY = tideLevel - 10;
                        let newX = ship.x + (windSpeed * 0.05) + ship.drift;

                        // Grounding Check
                        let isCrashed = false;
                        if (newY <= GROUND_LEVEL) {
                            newY = GROUND_LEVEL;
                            isCrashed = true;
                            playCrunchSound();
                        }

                        return { ...ship, x: newX, y: newY, crashed: isCrashed };
                    }));
                }, 1000 / 30); // 30 FPS

                return () => clearInterval(interval);
            }, [isPlaying, tideLevel, windSpeed]);

            // Sync simulation with slider when not playing manually
            useEffect(() => {
                if (!isPlaying) {
                    setShips(prev => prev.map((s, i) => {
                        let newY = tideLevel - 10;
                        let crashed = false;
                        if (newY <= GROUND_LEVEL) { newY = GROUND_LEVEL; crashed = true; }
                        let newX = 25 + (i * 25);
                        return { ...s, y: newY, x: newX, crashed };
                    }));
                }
            }, [tideLevel, isPlaying]);

            const handleTogglePlay = () => setIsPlaying(!isPlaying);

            // --- AMBUSH ARROWS COMPONENT ---
            const AmbushArrows = () => (
                <div className="absolute inset-0 pointer-events-none z-40 overflow-hidden">
                    {[...Array(15)].map((_, i) => (
                        <motion.div
                            key={i}
                            className="absolute h-0.5 bg-white drop-shadow-[0_0_5px_white]"

                                x: i % 2 === 0 ? ["0vw", "40vw"] : ["0vw", "-40vw"],

                            transition={{
                                duration: Math.random() * 0.5 + 0.5,
                                repeat: Infinity,
                                repeatDelay: Math.random() * 0.5,

                                    />
                                </div>

                                {/* Wind Control */}
                                <div>
                                    <div className="flex justify-between items-end mb-2">
                                        <label className="text-gray-400 font-mono text-xs font-bold">SỨC GIÓ</label>
                                        <span className="text-blue-400 font-mono font-bold">{windSpeed > 0 ? `+${windSpeed}` : windSpeed} m/s</span>
                                    </div>
                                    <input
                                        type="range" min="-10" max="10"

                                        className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                    />
                                </div>

                                {/* Status Monitor */}
                                <div className={`p-4 rounded border-l-4 transition-all duration-300 ${tideLevel < 30 ? 'bg-red-900/20 border-red-500' : 'bg-blue-900/20 border-blue-500'}`}>
                                    <div className="flex items-center gap-2 mb-1">
                                        <div className={`w-2 h-2 rounded-full ${tideLevel < 30 ? 'bg-red-500 animate-ping' : 'bg-blue-500'}`}></div>
                                        <span className={`font-bold font-mono text-xs ${tideLevel < 30 ? 'text-red-400' : 'text-blue-400'}`}>

                                    </div>
                                    <p className="text-xs text-gray-400 leading-relaxed">
                                        {tideLevel < 30
                                            ? "THỦY TRIỀU RÚT CẠN. Tàu địch bị dồn ép vào giữa dòng, va chạm đá ngầm. ĐỘI HÌNH VỠ."
                                            : "Dòng chảy ổn định. Hạm đội địch di chuyển tự do."}

                            {/* Simulation Area */}
                            <div className="col-span-1 lg:col-span-3 bg-[#020406] rounded-lg overflow-hidden border border-white/10 shadow-inner relative flex flex-col min-h-[500px]">

                                {/* 1. UPPER VISUALIZATION Area (Map/Scene) */}
                                <div className="flex-1 relative overflow-hidden bg-gradient-to-b from-[#1a202c] to-[#0d161f]">

                                    {/* Grid Overlay */}
                                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/graphy.png')] opacity-10"></div>

                                    <AnimatePresence>

                                        <div className="absolute bottom-0 left-[45%] w-[10%] h-[30%] bg-stone-700 opacity-90 z-10" style={{ clipPath: "polygon(50% 0%, 100% 100%, 0% 100%)" }} />

                                    {/* SHIPS RENDER */}
                                    <AnimatePresence>

                                                style={{ left: `${ship.x}%`, bottom: `${ship.y}%`, x: "-50%" }}
                                                animate={{
                                                    y: ship.crashed ? [0, 2, -2, 0] : [0, -2, 0], // Shake if crashed
                                                    rotate: ship.crashed ? (ship.id % 2 === 0 ? -15 : 10) : Math.sin(Date.now() / 1000 + ship.id) * 2 + (windSpeed),
                                                }}
                                                transition={{ duration: 0.1 }}
                                            >
                                                <SiamShip scale={ship.id === 1 ? 1.2 : 0.9} crashed={ship.crashed} isTrapped={tideLevel < 30} />

                                                {/* Fire Effect on Crash */}
                                                {ship.crashed && (
                                                    <div className="absolute bottom-[-10px] left-1/2 -translate-x-1/2 w-48 h-64 pointer-events-none z-50">
                                                        <RealisticFire />
                                                    </div>
                                                )}

                                                {/* HP Bar */}
                                                <div className="absolute -top-10 left-1/2 -translate-x-1/2 w-16 h-1 bg-black/50 rounded overflow-hidden">
                                                    <div className={`h-full ${ship.crashed ? 'bg-red-600 w-0' : 'bg-green-500 w-full'} transition-all duration-300`}></div>
                                                </div>
                                            </motion.div>
                                        ))}
                                    </AnimatePresence>
                                </div>

                                {/* 2. RIVERBED CROSS-SECTION (Analysis Chart) */}
                                <div className="h-[150px] bg-black border-t border-royal-gold/20 relative p-4 font-mono text-xs">
                                    <div className="absolute top-2 left-2 text-royal-gold font-bold flex items-center gap-2">
                                        <span className="material-symbols-outlined text-sm">analytics</span>
                                        MẮT CẮT LÒNG SÔNG
                                    </div>

                                    {/* Chart Container */}
                                    <div className="w-full h-full relative mt-4 border border-white/5 bg-white/5 rounded">
                                        {[0, 25, 50, 75, 100].map(p => (
                                            <div key={p} className="absolute left-0 w-full border-t border-white/5" style={{ bottom: `${p}%` }}>
                                                <span className="absolute -left-0 -top-2 text-gray-600 text-[9px] pl-1">{p}m</span>
                                            </div>
                                        ))}

                                        {/* Dangerous Rock Level Line */}
                                        <div className="absolute left-0 w-full border-t-2 border-red-500/50 border-dashed bottom-[25%] z-0">
                                            <span className="text-red-500 bg-black px-1 absolute right-0 -top-3 text-[10px]">NGƯỠNG NGUY HIỂM</span>
                                        </div>

                                        {/* Dynamic Water Level */}
                                        <motion.div
                                            className="absolute left-0 w-full bg-blue-500/10 border-t border-blue-400/50 transition-all duration-75 relative"
                                            style={{ height: `${tideLevel}%`, bottom: 0 }}
                                        >
                                            <div className="absolute right-2 top-0 text-blue-300 text-[10px] bg-black/50 px-1 rounded">Mực nước: {tideLevel}m</div>
                                        </motion.div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </section>
            );
        };
        // --- COMPONENT MỚI 2: PHÂN TÍCH ĐỊA HÌNH (Cards) ---
        const TerrainDetails = () => {
            const terrains = [
                {
                    icon: "landscape",
                    title: "Cù Lao Thới Sơn",
                    sub: "LÁ CHẮN TỰ NHIÊN",
                    desc: "Nằm giữa sông Tiền, cù lao này chia dòng sông làm hai nhánh. Nguyễn Huệ giấu quân chủ lực và đại bác ở đây để bắn kẹp sườn (flanking) vào đội hình địch."
                },
                {
                    icon: "water_lock",
                    title: "Sông Rạch Gầm",
                    sub: "TÚI ĐỰNG QUÂN",
                    desc: "Đoạn sông phình to ở giữa nhưng thắt lại ở hai đầu. Khi quân địch lọt vào, chúng bị ùn ứ, tàu to không quay đầu được, trở thành bia tập bắn."
                },
                {
                    icon: "forest",
                    title: "Rừng Dừa Nước",
                    sub: "ÁO TÀNG HÌNH",
                    desc: "Hai bên bờ là rừng rậm rạp, che giấu hoàn toàn hàng vạn quân mai phục. Địch đi qua mà không hề hay biết cho đến khi súng nổ."
                }
            ];

            return (
                <section className="py-20 bg-paper-texture bg-paper text-ink-black relative">
                    <div className="max-w-6xl mx-auto px-4">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {terrains.map((t, i) => (
                                <div key={i} className="group relative bg-white/80 p-6 border-2 border-ink-black hover:-translate-y-2 transition-all duration-300 shadow-lg hover:shadow-2xl cursor-pointer overflow-hidden">
                                    {/* Hiệu ứng Hover nền */}
                                    <div className="absolute inset-0 bg-royal-gold transform scale-x-0 group-hover:scale-x-100 transition-transform duration-500 origin-left z-0"></div>

                                    <div className="relative z-10 group-hover:text-white transition-colors">
                                        <div className="w-12 h-12 border-2 border-ink-black group-hover:border-white rounded-full flex items-center justify-center mb-4">
                                            <span className="material-symbols-outlined text-2xl">{t.icon}</span>
                                        </div>
                                        <span className="text-xs font-bold tracking-widest uppercase text-blood-red group-hover:text-black mb-2 block">{t.sub}</span>
                                        <h3 className="text-2xl font-epic font-bold mb-3">{t.title}</h3>
                                        <p className="font-poetry text-sm leading-relaxed opacity-80">{t.desc}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // --- NEW CINEMATIC COMPONENTS ---

        // 1. Custom Cursor (Optimized with useMotionValue)
        const CustomCursor = () => {
            if (!useMotionValue) return null;

            const mouseX = useMotionValue(0);
            const mouseY = useMotionValue(0);

            useEffect(() => {
                const moveCursor = (e) => {
                    mouseX.set(e.clientX);
                    mouseY.set(e.clientY);
                };
                window.addEventListener('mousemove', moveCursor);
                return () => window.removeEventListener('mousemove', moveCursor);
            }, []);

            return (
                <>
                    <style>{`
                * { cursor: none !important; }
                .custom-cursor {
                    pointer-events: none;
                    z-index: 9999;
                    position: fixed;
                    top: 0;
                    left: 0;
                    mix-blend-mode: exclusion;
                }
            `}</style>

                    <motion.div
                        className="custom-cursor w-6 h-6 bg-white rounded-full"
                        style={{
                            x: mouseX,
                            y: mouseY,
                            translateX: "-50%",
                            translateY: "-50%",
                        }}
                    />
                </>
            );
        };


        // 2. Cinematic Fog (Canvas Based)
        const CinematicFog = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                const particles = [];
                const maxParticles = 50;

                for (let i = 0; i < maxParticles; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: Math.random() * 0.5 - 0.25,
                        vy: Math.random() * 0.2 - 0.1,
                        size: Math.random() * 100 + 50,
                        alpha: Math.random() * 0.3 + 0.1
                    });
                }

                const animate = () => {
                    ctx.clearRect(0, 0, width, height);

                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;

                        if (p.x < -p.size) p.x = width + p.size;
                        if (p.x > width + p.size) p.x = -p.size;
                        if (p.y < -p.size) p.y = height + p.size;
                        if (p.y > height + p.size) p.y = -p.size;

                        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                        gradient.addColorStop(0, `rgba(200, 200, 200, ${p.alpha})`);
                        gradient.addColorStop(1, 'rgba(200, 200, 200, 0)');

                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    requestAnimationFrame(animate);
                };

                animate();

                const handleResize = () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);

            }, []);

            return <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none z-10 opacity-30 mix-blend-screen" />;
        };

        // --- RESTORED COMPONENT: EmberParticles (Used in Timeline) ---
        const EmberParticles = () => {
            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none z-20">
                    {[...Array(20)].map((_, i) => (
                        <motion.div
                            key={i}
                            className="absolute bg-orange-500 rounded-full"
                            initial={{
                                x: Math.random() * 100 + "%",
                                y: "100%",
                                opacity: 1,
                                scale: Math.random() * 0.5 + 0.5
                            }}
                            animate={{
                                y: "-10%",
                                opacity: 0,
                                x: `calc(${Math.random() * 100}% + ${Math.random() * 200 - 100}px)`
                            }}
                            transition={{
                                duration: Math.random() * 3 + 2,
                                repeat: Infinity,
                                ease: "linear",
                                delay: Math.random() * 5
                            }}
                            style={{
                                width: Math.random() * 4 + 2 + "px",
                                height: Math.random() * 4 + 2 + "px",
                                boxShadow: "0 0 10px #ff4500"
                            }}
                        />
                    ))}
                </div>
            );
        };

        // 3. Realistic Fire Effect (Multi-layered)
        const RealisticFire = () => {
            return (
                <div className="absolute inset-0 z-50 pointer-events-none" style={{ mixBlendMode: 'screen' }}>
                    {/* Dark Smoke Layer (Base) */}
                    {[...Array(15)].map((_, i) => (

                            key={`smoke-${i}`}

                                x: "50%",
                                y: "20%",
                                scale: 0.5,
                                opacity: 0
                            }}
                            animate={{
                                x: [`${50 + (Math.random() * 40 - 20)}%`, `${50 + (Math.random() * 100 - 50)}%`],
                                y: ["20%", "-150%"],
                                scale: [1, 3],
                                opacity: [0.6, 0]
                            }}
                            transition={{
                                duration: Math.random() * 2 + 2,
                                repeat: Infinity,
                                ease: "easeOut",
                                delay: Math.random() * 2
                            }}
                            style={{
                                width: Math.random() * 40 + 30 + "px",
                                height: Math.random() * 40 + 30 + "px",
                            }}
                        />
                    ))}

                    {/* Orange/Red Flame Core (Middle) */}
                    {[...Array(25)].map((_, i) => (
                        <motion.div
                            key={`flame-main-${i}`}
                            className="absolute bottom-0 bg-gradient-to-t from-red-600 via-orange-500 to-yellow-400 rounded-full blur-md"
                            initial={{
                                x: "50%",
                                y: "10%",
                                scale: 0.8,
                                opacity: 0
                            }}
                            animate={{
                                x: [`${50 + (Math.random() * 20 - 10)}%`, `${50 + (Math.random() * 60 - 30)}%`],
                                y: ["10%", "-80%"],
                                scale: [1, 0],
                                opacity: [0.8, 0]
                            }}
                            transition={{
                                duration: Math.random() * 1 + 0.5,
                                repeat: Infinity,
                                ease: "circOut",
                                delay: Math.random()
                            }}
                            style={{
                                width: Math.random() * 25 + 15 + "px",
                                height: Math.random() * 25 + 15 + "px",
                                left: "-10%"
                            }}
                        />
                    ))}

                    {/* Bright Yellow Sparks (Top) */}
                    {[...Array(20)].map((_, i) => (
                        <motion.div
                            key={`spark-${i}`}
                            className="absolute bottom-0 bg-white rounded-full"
                            initial={{
                                x: "50%",
                                y: "20%",
                                opacity: 1
                            }}
                            animate={{
                                y: "-120%",
                                x: `calc(50% + ${Math.random() * 100 - 50}px)`,
                                opacity: [1, 0]
                            }}
                            transition={{
                                duration: Math.random() * 1 + 0.5,
                                repeat: Infinity,
                                ease: "linear",
                                delay: Math.random()
                            }}
                            style={{
                                width: Math.random() * 3 + 1 + "px",
                                height: Math.random() * 3 + 1 + "px",
                                boxShadow: "0 0 5px #fff"
                            }}
                        />
                    ))}
                </div>
            );
        };

        // 4. Generals Profile (3D Tilt Cards - No Change)
        const GeneralsProfile = () => {
            const generals = [
                {
                    name: "NGUYỄN HUỆ",
                    role: "Long Nhương Tướng Quân",
                    desc: "Thiên tài quân sự, người vạch ra kế hoạch Rạch Gầm - Xoài Mút độc đáo, nghiền nát 5 vạn quân Xiêm trong chưa đầy một ngày.",
                    stats: { intel: 100, courage: 100, command: 100 },
                    color: "from-yellow-700 to-yellow-900"
                },
                {
                    name: "TRẦN QUANG DIỆU",
                    role: "Đô Đốc",
                    desc: "Dũng tướng tiên phong, chỉ huy lực lượng bộ binh mai phục, chặn đường rút lui của địch lên bờ.",
                    stats: { intel: 85, courage: 95, command: 90 },
                    color: "from-red-700 to-red-900"
                },
                {
                    name: "VÕ VĂN DŨNG",
                    role: "Đô Đốc",
                    desc: "Chỉ huy thủy quân Tây Sơn, trực tiếp cầm lái những mũi thuyền cảm tử lao vào đội hình địch.",
                    stats: { intel: 90, courage: 90, command: 85 },
                    color: "from-blue-700 to-blue-900"
                }
            ];

            const TiltCard = ({ data }) => {
                const x = useMotionValue(0);
                const y = useMotionValue(0);

                // Smoother spring physics
                const mouseX = window.Motion.useSpring(x, { stiffness: 500, damping: 30 });
                const mouseY = window.Motion.useSpring(y, { stiffness: 500, damping: 30 });

                const rotateX = useTransform(mouseY, [-100, 100], [15, -15]);
                const rotateY = useTransform(mouseX, [-100, 100], [-15, 15]);

                function handleMouse(event) {
                    const rect = event.currentTarget.getBoundingClientRect();
                    x.set(event.clientX - rect.left - rect.width / 2);
                    y.set(event.clientY - rect.top - rect.height / 2);
                }

                return (
                    <motion.div
                        className="perspective-1000 relative h-96 w-full cursor-pointer"
                        onMouseMove={handleMouse}
                        onMouseLeave={() => { x.set(0); y.set(0); }}
                        style={{ perspective: 1000 }}
                    >
                        <motion.div
                            className={`w-full h-full rounded-xl bg-gradient-to-br ${data.color} p-1 shadow-xl overflow-hidden border border-white/10`}
                            style={{ rotateX, rotateY, transformStyle: "preserve-3d" }}
                            whileHover={{ scale: 1.05 }}
                        >
                            <div className="absolute inset-0 bg-black/40" style={{ transform: "translateZ(0px)" }}></div>
                            <div className="relative h-full bg-black/80 rounded-lg p-6 flex flex-col items-center text-center backdrop-blur-sm" style={{ transform: "translateZ(30px)" }}>
                                <motion.div
                                    className="w-20 h-20 rounded-full bg-gradient-to-t from-gray-200 to-gray-400 mb-4 border-2 border-royal-gold shadow-[0_0_15px_rgba(212,175,55,0.5)] flex items-center justify-center text-3xl font-black text-black"
                                    whileHover={{ scale: 1.1, rotate: 360, transition: { duration: 0.8 } }}
                                >
                                    {data.name.charAt(0)}
                                </motion.div>
                                <h3 className="text-2xl font-epic font-bold text-white mb-1">{data.name}</h3>
                                <span className="text-royal-gold font-mono text-xs uppercase tracking-widest mb-4 block">{data.role}</span>
                                <p className="text-gray-300 text-sm leading-relaxed mb-6">{data.desc}</p>
                                <div className="w-full space-y-2 mt-auto">
                                    {Object.entries(data.stats).map(([key, val]) => {
                                        const mapKeyToVN = {
                                            intel: "Trí Tuệ",
                                            courage: "Dũng Cảm",
                                            command: "Chỉ Huy"
                                        };
                                        return (
                                            <div key={key} className="flex items-center gap-2 text-xs font-mono text-gray-500 uppercase">
                                                <span className="w-16 text-right">{mapKeyToVN[key]}</span>
                                                <div className="flex-1 h-1 bg-gray-700 rounded-full overflow-hidden">
                                                    <motion.div
                                                        initial={{ width: 0 }}
                                                        whileInView={{ width: `${val}%` }}
                                                        transition={{ duration: 1, delay: 0.5 }}
                                                        className="h-full bg-royal-gold"
                                                    />
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                            <div className="absolute inset-0 bg-gradient-to-tr from-transparent via-white/10 to-transparent pointer-events-none mix-blend-overlay" style={{ transform: "translateZ(50px)" }}></div>
                        </motion.div>
                    </motion.div>
                );
            };

            return (
                <section className="py-24 bg-[#0a0f14] relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                    <CinematicFog />
                    <div className="max-w-6xl mx-auto px-4 relative z-10">
                        <div className="text-center mb-16">
                            <span className="text-blue-500 font-bold tracking-[0.3em] uppercase text-sm">Bộ Chỉ Huy</span>
                            <h3 className="text-4xl md:text-6xl font-epic font-black mt-2 text-white uppercase drop-shadow-lg">Hùng Tài Đại Lược</h3>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {generals.map((g, i) => <TiltCard key={i} data={g} />)}
                        </div>
                    </div>
                </section>
            );
        };
        // --- COMPONENT MỚI: TIDE CLOCK (Đồng Hồ Thủy Triều) ---
        const TideClock = () => {
            return (
                <section className="py-20 bg-ink-black relative border-t border-royal-gold/20">
                    <div className="max-w-4xl mx-auto px-4">
                        <div className="text-center mb-12">
                            <span className="text-blue-400 font-bold tracking-[0.3em] uppercase text-sm">Thiên Thời</span>
                            <h3 className="text-3xl md:text-5xl font-epic font-black mt-2 text-white uppercase">Nhịp Đập Dòng Sông</h3>
                            <p className="mt-4 text-gray-400 italic">"Nguyễn Huệ đã tính toán chính xác chu kỳ con nước để biến nó thành vũ khí hủy diệt."</p>
                        </div>

                        {/* Chart Container */}
                        <div className="relative h-64 bg-[#0a1016] rounded-xl border border-royal-gold/30 p-6 overflow-hidden">
                            {/* Grid Lines */}
                            <div className="absolute inset-0 grid grid-cols-12 gap-0 border-b border-royal-gold/10">
                                {[...Array(12)].map((_, i) => (
                                    <div key={i} className="border-r border-royal-gold/5 h-full relative">
                                        <span className="absolute bottom-1 left-1 text-[8px] text-gray-600">{i * 2}h</span>
                                    </div>
                                ))}
                            </div>

                            {/* Tide Sine Wave */}
                            <svg className="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none">
                                <motion.path
                                    d="M0,150 C100,20 200,20 300,150 C400,280 500,280 600,150 C700,20 800,20 900,150 L900,300 L0,300 Z"
                                    fill="url(#gradientWater)"
                                    className="opacity-50"
                                    initial={{ d: "M0,300 L900,300 L0,300 Z" }}
                                    whileInView={{ d: "M0,150 C150,50 300,50 450,150 C600,250 750,250 900,150 L900,300 L0,300 Z" }}
                                    transition={{ duration: 2, ease: "easeInOut" }}
                                />
                                <defs>
                                    <linearGradient id="gradientWater" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" stopColor="#3b82f6" stopOpacity="0.6" />
                                        <stop offset="100%" stopColor="#3b82f6" stopOpacity="0.1" />
                                    </linearGradient>
                                </defs>
                                {/* Tide Line */}
                                <motion.path
                                    d="M0,150 C150,50 300,50 450,150 C600,250 750,250 900,150"
                                    fill="none"
                                    stroke="#60a5fa"
                                    strokeWidth="3"
                                    initial={{ pathLength: 0 }}
                                    whileInView={{ pathLength: 1 }}
                                    transition={{ duration: 3, ease: "easeInOut" }}
                                />
                            </svg>

                            {/* Event Markers - Absolute positioning based on approximate chart locations */}
                            {/* High Tide - Entry */}
                            <div className="absolute top-[20%] left-[20%]">
                                <motion.div
                                    initial={{ opacity: 0, y: 10 }}
                                    whileInView={{ opacity: 1, y: 0 }}
                                    transition={{ delay: 1 }}
                                    className="flex flex-col items-center group cursor-pointer"
                                >
                                    <div className="w-4 h-4 rounded-full bg-blue-500 border-2 border-white animate-pulse"></div>
                                    <div className="mt-2 bg-black/80 text-blue-300 text-xs px-2 py-1 rounded border border-blue-500/50">
                                        ĐÊM 19/1: NƯỚC LỚN<br /><span className="text-white">Địch vào trận địa</span>
                                    </div>
                                    {/* Vertical Line */}
                                    <div className="w-[1px] h-20 bg-blue-500/30"></div>
                                </motion.div>
                            </div>

                            {/* Low Tide - Ambush */}
                            <div className="absolute bottom-[20%] left-[60%]">
                                <motion.div
                                    initial={{ opacity: 0, y: -10 }}
                                    whileInView={{ opacity: 1, y: 0 }}
                                    transition={{ delay: 2 }}
                                    className="flex flex-col items-center group cursor-pointer"
                                >
                                    {/* Vertical Line Upwards */}
                                    <div className="w-[1px] h-20 bg-red-500/30 mb-2"></div>
                                    <div className="bg-black/80 text-red-400 text-xs px-2 py-1 rounded border border-red-500/50 mb-2">
                                        SÁNG 20/1: NƯỚC RÒNG<br /><span className="text-white">Tổng phản công</span>
                                    </div>
                                    <div className="w-4 h-4 rounded-full bg-red-600 border-2 border-royal-gold animate-bounce"></div>
                                </motion.div>
                            </div>
                        </div>

                        {/* Explanation */}
                        <div className="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6 text-sm">
                            <div className="bg-blue-900/10 p-4 rounded border-l-2 border-blue-500">
                                <h4 className="font-bold text-blue-400 mb-1">NƯỚC LỚN (Đêm)</h4>
                                <p className="text-gray-400">Dòng nước chảy mạnh vào trong, giúp pháo hạm nặng nề của Xiêm lướt nhanh vào cạm bẫy mà không tốn sức, khiến chúng chủ quan.</p>
                            </div>
                            <div className="bg-red-900/10 p-4 rounded border-l-2 border-red-500">
                                <h4 className="font-bold text-red-500 mb-1">NƯỚC RÒNG (Sáng)</h4>
                                <p className="text-gray-400">Nước rút nhanh ra biển. Thuyền giặc ngược dòng bị kìm lại, va vào nhau và mắc cạn. Quân Tây Sơn xuôi dòng thả bè lửa.</p>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // --- COMPONENT MỚI: GEO TACTICS (Địa Thế Chiến Thuật) ---
        const GeoTactics = () => {
            return (
                <section className="py-16 bg-[#0c1218] relative overflow-hidden">
                    {/* Background Compass Decoration */}
                    <div className="absolute -right-20 top-10 opacity-5 spin-slow">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Compass_rose_brown.svg/1024px-Compass_rose_brown.svg.png" width="400" />
                    </div>

                    <div className="max-w-6xl mx-auto px-4 relative z-10">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">

                            {/* Graphic Visualization of the Bottleneck - REPLACED WITH SIMULATION */}
                            <div className="h-[400px] w-full">
                                <BottleneckTrap />
                            </div>

                            {/* Text Info */}
                            <div>
                                <span className="text-red-500 font-bold tracking-[0.3em] uppercase text-sm">Địa Lợi</span>
                                <h3 className="text-4xl font-epic font-black mt-2 text-white">Thế Trận "Bao Tải"</h3>
                                <p className="mt-6 text-gray-300 leading-relaxed text-lg text-justify font-light">
                                    Đoạn sông Rạch Gầm - Xoài Mút dài khoảng 7km, có địa thế vô cùng đặc biệt.
                                    Lòng sông đang rộng bỗng nhiên thắt lại ở eo Xoài Mút, tạo thành hình dáng như một chiếc bao tải.
                                </p>
                                <ul className="mt-8 space-y-4">
                                    <li className="flex gap-4 items-start">
                                        <span className="material-symbols-outlined text-royal-gold bg-royal-gold/10 p-2 rounded">compress</span>
                                        <div>
                                            <h4 className="text-royal-gold font-bold">Điểm Thắt Nút</h4>
                                            <p className="text-sm text-gray-400">Khi bị tấn công, hàng trăm tàu địch dồn về cửa Xoài Mút chật hẹp, tự va chạm và tắc nghẽn.</p>
                                        </div>
                                    </li>
                                    <li className="flex gap-4 items-start">
                                        <span className="material-symbols-outlined text-royal-gold bg-royal-gold/10 p-2 rounded">visibility_off</span>
                                        <div>
                                            <h4 className="text-royal-gold font-bold">Góc Chết Tầm Nhìn</h4>
                                            <p className="text-sm text-gray-400">Cù lao Thới Sơn chắn giữa dòng che khuất tầm nhìn, khiến địch không thấy được hạm đội Tây Sơn đang chờ sẵn.</p>
                                        </div>
                                    </li>
                                </ul>
                            </div>

                        </div>
                    </div>
                </section>
            );
        };

        // --- COMPONENT MỚI: BOTTLENECK TRAP (BẪY BAO TẢI) ---
        const BottleneckTrap = () => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [phase, setPhase] = useState(1); // 1: Entry, 2: Congestion, 3: Chaos
            const [ships, setShips] = useState([]);
            const [crashes, setCrashes] = useState([]);
            const animationRef = useRef(null);
            const frameCount = useRef(0);

            // Simulation Constants
            const SPAWN_RATE = 20; // Frames between spawns
            const RIVER_LENGTH = 100; // Percent
            const WIDE_WIDTH = 80;
            const NARROW_WIDTH = 25;
            const BOTTLENECK_START = 60; // Percent where it narrows

            // Reset Simulation
            const resetSim = () => {
                setIsPlaying(false);
                setShips([]);
                setCrashes([]);
                setPhase(1);
                frameCount.current = 0;
                if (animationRef.current) cancelAnimationFrame(animationRef.current);
            };

            const togglePlay = () => {
                if (isPlaying) {
                    setIsPlaying(false);
                    if (animationRef.current) cancelAnimationFrame(animationRef.current);
                } else {
                    setIsPlaying(true);
                }
            };

            // Game Loop
            useEffect(() => {
                if (!isPlaying) return;

                const loop = () => {
                    frameCount.current++;

                    setShips(prev => {
                        let newShips = [...prev];

                        // 1. SPAWN SHIPS
                        if (frameCount.current % SPAWN_RATE === 0 && frameCount.current < 600) {
                            newShips.push({
                                id: Date.now() + Math.random(),
                                x: 0,
                                y: 50 + (Math.random() * 40 - 20), // Random spread in wide area
                                speed: 0.5 + Math.random() * 0.1,
                                status: 'normal', // normal, slow, crashed
                                lane: Math.random() // For vertical separation visuals
                            });
                        }

                        // 2. UPDATE POSITIONS & PHYSICS
                        newShips = newShips.map(ship => {
                            if (ship.status === 'crashed') return ship;

                            let nextX = ship.x + ship.speed;
                            let nextY = ship.y;
                            let nextSpeed = ship.speed;
                            let nextStatus = ship.status;

                            // Calculate River Width at current X
                            let currentRiverWidth = WIDE_WIDTH;
                            if (nextX > BOTTLENECK_START) {
                                // Linear narrowing
                                const progress = Math.min(1, (nextX - BOTTLENECK_START) / 20);
                                currentRiverWidth = WIDE_WIDTH - (progress * (WIDE_WIDTH - NARROW_WIDTH));
                            }

                            // Constrain Y to river banks
                            const bankSize = (100 - currentRiverWidth) / 2;
                            if (nextY < bankSize + 5) nextY = bankSize + 5; // Top Bank
                            if (nextY > 100 - bankSize - 5) nextY = 100 - bankSize - 5; // Bottom Bank

                            // Squeeze effect: push towards center as it narrows
                            if (nextX > BOTTLENECK_START) {
                                if (nextY > 50) nextY -= 0.1;
                                if (nextY < 50) nextY += 0.1;
                                nextSpeed *= 0.98; // Slow down in bottleneck
                            }

                            // 3. COLLISION / CONGESTION CHECK
                            // Simple logic: if in narrow part and close to another ship -> CRASH
                            if (nextX > BOTTLENECK_START + 10) {
                                const crowding = newShips.filter(s =>
                                    s.id !== ship.id &&
                                    Math.abs(s.x - nextX) < 2 &&
                                    Math.abs(s.y - nextY) < 5
                                );

                                if (crowding.length > 0) {
                                    nextStatus = 'crashed';
                                    // Trigger explosion effect
                                    setCrashes(prevCrashes => [
                                        ...prevCrashes,
                                        { x: nextX, y: nextY, id: Date.now() }
                                    ]);
                                }
                            }

                            return { ...ship, x: nextX, y: nextY, speed: nextSpeed, status: nextStatus };
                        });

                        // Filter out finished ships
                        return newShips.filter(s => s.x < 110);
                    });

                    // Update Phase Text
                    if (frameCount.current < 200) setPhase(1);
                    else if (frameCount.current < 450) setPhase(2);
                    else setPhase(3);

                    animationRef.current = requestAnimationFrame(loop);
                };

                animationRef.current = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(animationRef.current);
            }, [isPlaying]);

            // Render: Embedded Mode for GeoTactics
            return (
                <div className="w-full h-full flex flex-col bg-[#050a0e] rounded-xl overflow-hidden border border-royal-gold/20 shadow-2xl">
                    {/* MINI CONTROL PANEL */}
                    <div className="flex items-center justify-between bg-[#111827] p-3 border-b border-royal-gold/30 shrink-0">
                        <button
                            onClick={togglePlay}
                            className={`px-3 py-1 rounded text-xs font-bold uppercase tracking-wider transition-all ${isPlaying ? 'bg-red-900 text-white border border-red-500' : 'bg-royal-gold text-black hover:bg-white'}`}
                        >
                            {isPlaying ? 'Dừng' : 'Chạy Mô Phỏng'}
                        </button>

                        <div className="flex-1 text-right ml-2">
                            <span className={`font-mono text-[10px] md:text-xs font-bold transition-all duration-300 ${phase === 1 ? 'text-green-400' : phase === 2 ? 'text-yellow-400' : 'text-red-500 animate-pulse'
                                }`}>
                                {phase === 1 && "GIAI ĐOẠN 1: ĐỊCH VÀO RỌ"}
                                {phase === 2 && "GIAI ĐOẠN 2: ÙN TẮC CỤC BỘ"}
                                {phase === 3 && "GIAI ĐOẠN 3: TỔNG TẤN CÔNG!"}
                            </span>
                        </div>
                    </div>

                    {/* STAGE CONTAINER */}
                    <div className="relative flex-1 w-full bg-[#050a0e] overflow-hidden">

                        {/* 1. GEOGRAPHY LAYERS (STATIC) */}
                        {/* Draw River Shape using ClipPath */}
                        <div className="absolute inset-0 bg-[#0c1620]">
                            {/* Top Bank */}
                            <div
                                className="absolute top-0 left-0 w-full bg-[#1f2937] border-b-2 border-[#d4af37]"
                                style={{ height: '100%', clipPath: 'polygon(0 0, 100% 0, 100% 40%, 65% 35%, 0 10%)' }}
                            >
                                <div className="absolute bottom-2 left-4 text-white/20 font-bold text-[10px]">BỜ BẮC</div>
                            </div>

                            {/* Bottom Bank */}
                            <div
                                className="absolute bottom-0 left-0 w-full bg-[#1f2937] border-t-2 border-[#d4af37]"
                                style={{ height: '100%', clipPath: 'polygon(0 100%, 100% 100%, 100% 60%, 65% 65%, 0 90%)' }}
                            >
                                <div className="absolute top-2 left-4 text-white/20 font-bold text-[10px]">BỜ NAM</div>
                            </div>
                        </div>

                        {/* LABELS */}
                        <div className="absolute top-1/2 left-4 -translate-y-1/2 text-center z-0 pointer-events-none">
                            <div className="text-green-500/30 text-2xl font-black">CỬA RỘNG</div>
                        </div>
                        <div className="absolute top-1/2 right-4 -translate-y-1/2 text-center z-0 pointer-events-none">
                            <div className="text-red-500/30 text-2xl font-black">CỬA TỬ</div>
                        </div>

                        {/* 2. DYNAMIC LAYERS */}

                        {/* SHIPS */}
                        <AnimatePresence>
                            {ships.map(ship => (
                                <motion.div
                                    key={ship.id}
                                    className="absolute text-red-600"
                                    style={{
                                        left: `${ship.x}%`,
                                        top: `${ship.y}%`,
                                        width: '10px',
                                        height: '10px',
                                        marginLeft: '-5px',
                                        marginTop: '-5px'
                                    }}
                                    animate={{
                                        rotate: ship.status === 'crashed' ? Math.random() * 360 : 90,
                                        scale: ship.status === 'crashed' ? 0.8 : 1
                                    }}
                                >
                                    <svg viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2L22 22L12 18L2 22L12 2Z" />
                                    </svg>
                                </motion.div>
                            ))}
                        </AnimatePresence>

                        {/* CRASH EXPLOSIONS */}
                        {crashes.map(crash => (
                            <motion.div
                                key={crash.id}
                                className="absolute w-6 h-6 bg-red-500/50 rounded-full blur-sm"
                                style={{ left: `${crash.x}%`, top: `${crash.y}%`, x: '-50%', y: '-50%' }}
                                initial={{ scale: 0, opacity: 1 }}
                                animate={{ scale: 2, opacity: 0 }}
                                transition={{ duration: 0.5 }}
                            />
                        ))}

                        {/* 3. AMBUSH OVERLAY */}
                        {phase === 3 && (
                            <div className="absolute inset-0 pointer-events-none z-20">
                                <motion.div
                                    initial={{ opacity: 0 }}
                                    animate={{ opacity: 1 }}
                                    className="absolute right-[20%] top-[20%] w-24 h-24 border-2 border-red-500/50 rounded-full animate-ping"
                                ></motion.div>

                                {[1, 2].map(i => (
                                    <motion.div
                                        key={i}
                                        className="absolute"
                                        style={{ right: '25%', top: `${30 + i * 15}%` }}
                                        initial={{ x: 30, opacity: 0 }}
                                        animate={{ x: 0, opacity: 1 }}
                                        transition={{ repeat: Infinity, duration: 1, delay: i * 0.2 }}
                                    >
                                        <span className="material-symbols-outlined text-red-500 text-3xl rotate-180">arrow_right_alt</span>
                                    </motion.div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };



        // --- MAIN APP ---
        const App = () => {
            const [introDone, setIntroDone] = useState(false);

            return (
                <main className="relative bg-[#050a0e] text-gray-200 selection:bg-blood-red selection:text-white cursor-none">
                    <CustomCursor />
                    {!introDone && <IntroOverlay onComplete={() => setIntroDone(true)} />}

                    {/* Các thành phần tiện ích cố định */}
                    <ScrollProgress />
                    <AudioPlayer />


                    {/* Nội dung chính */}
                    <FadeSection>
                        <Hero />
                    </FadeSection>

                    <FadeSection>
                        <Stats />
                    </FadeSection>

                    {/* Phần trọng tâm: Đặt StrategyMap và TideSimulation gần nhau để nhấn mạnh mối liên hệ */}
                    <FadeSection>
                        <div className="py-10 bg-ink-black text-center relative overflow-hidden">
                            <CinematicFog />
                            <div className="relative z-10">
                                <h2 className="text-3xl font-epic text-royal-gold mb-4">PHÂN TÍCH ĐỊA LỢI & THỦY VĂN</h2>
                                <p className="text-gray-400 max-w-2xl mx-auto italic">"Yếu tố quyết định chiến thắng không chỉ là con người, mà là việc biến dòng sông thành vũ khí."</p>
                            </div>
                        </div>
                        <StrategyMap />
                    </FadeSection>



                    <FadeSection>
                        <TerrainDetails />
                    </FadeSection>

                    <FadeSection>
                        <GeoTactics />
                    </FadeSection>

                    <FadeSection>
                        <GeneralsProfile />
                    </FadeSection>

                    {/* Combine Tide Context */}
                    <FadeSection>
                        <TideClock />
                        <TideSimulation />
                    </FadeSection>

                    <FadeSection>
                        <Timeline />
                    </FadeSection>

                    <FadeSection>
                        <Arsenal />
                    </FadeSection>

                    {/* Footer */}
                    <footer className="py-8 text-center text-gray-600 font-mono text-xs border-t border-white/5 bg-black">
                        © 2026 PROJECT DECODED 1785 // DESIGNED BY ANDY
                    </footer>
                </main>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
